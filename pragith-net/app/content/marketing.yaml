utm_defaults:
  source: pragith_net
  medium: website_cta
  campaign: inbound_consulting

default_project_type: Agentic Fleet Build

project_type_rules:
  - contains: /business/dashboards
    project_type: Executive KPI Dashboard
  - contains: /business/whatsapp-automation
    project_type: Lead and WhatsApp Automation
  - contains: /training
    project_type: Corporate Training
  - contains: /business/automation
    project_type: Agentic Orchestration
  - contains: /offerings
    project_type: OpenClaw/Hermes Integration
  - contains: /packages/
    project_type: System Architecture
