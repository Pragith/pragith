<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pragith Prakash{% endblock %}</title>
    <meta name="description" content="{% block description %}{% endblock %}">
    
    <style>
        /* CSS Custom Properties from DESIGN.md */
        :root {
          /* Colors */
          --color-midnight-graphite: #1d1d1f;
          --color-cloud-mist: #6b6c6c;
          --color-pure-white: #ffffff;
          --color-frost-gray: #f3f6f6;
          --color-steel-accent: #cccfcf;
          --color-dark-charcoal: #313131;
          --color-slate-echo: #444545;
          --color-alabaster: #e8e8ed;
          --color-pure-black: #000000;
          --color-light-pearl: #dedfe2;
          --color-ocean-blue: #0066cc;
          --color-sky-teal: #00a1b3;
          --color-royal-violet: #8668ff;
          --color-sunset-orange: #ed6300;
          --color-flame-orange: #b64400;
          --color-vivid-blue: #0071e3;
          --color-deep-sea-gradient: #004c94;
          --color-spectrum-gradient: #0090f7;

          /* Typography — Font Families */
          --font-sf-pro-text: 'SF Pro Text', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          --font-sf-pro-display: 'SF Pro Display', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          --font-arial: 'Arial', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

          /* Typography — Scale */
          --text-body: 14px;
          --leading-body: 1.29;
          --tracking-body: -0.168px;
          --text-subheading: 18px;
          --leading-subheading: 1.24;
          --tracking-subheading: -0.342px;
          --text-heading-sm: 20px;
          --leading-heading-sm: 1.2;
          --tracking-heading-sm: -0.4px;
          --text-heading: 24px;
          --leading-heading: 1.18;
          --tracking-heading: -0.288px;
          --text-heading-lg: 44px;
          --leading-heading-lg: 1.14;
          --tracking-heading-lg: -0.484px;
          --text-display: 80px;
          --leading-display: 1.07;
          --tracking-display: -0.8px;
          --text-display-xl: 160px;
          --leading-display-xl: 0.88;
          --tracking-display-xl: -0.8px;

          /* Spacing */
          --spacing-4: 4px;
          --spacing-6: 6px;
          --spacing-8: 8px;
          --spacing-9: 9px;
          --spacing-10: 10px;
          --spacing-11: 11px;
          --spacing-13: 13px;
          --spacing-14: 14px;
          --spacing-19: 19px;
          --spacing-20: 20px;
          --spacing-25: 25px;
          --spacing-28: 28px;
          --spacing-30: 30px;
          --spacing-40: 40px;
          --spacing-44: 44px;
          --spacing-83: 83px;

          /* Layout */
          --section-gap: 70px;
          --card-padding: 14px;
          --element-gap: 10px;

          /* Border Radius */
          --radius-xl: 12px;
          --radius-3xl: 24px;
          --radius-3xl-2: 28px;
          --radius-3xl-3: 32px;
          --radius-3xl-4: 36px;
          --radius-full: 170px;
          --radius-full-2: 980px;

          /* Shadows */
          --shadow-subtle: rgba(0, 0, 0, 0.11) 0px 0px 1px 0px inset;
          --shadow-xl: rgba(0, 0, 0, 0.05) 0px 0px 35px 20px;

          /* Surfaces */
          --surface-pure-white: #ffffff;
          --surface-frost-gray: #f3f6f6;
          --surface-alabaster: #e8e8ed;
        }

        /* Global Resets & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--surface-pure-white);
            color: var(--color-midnight-graphite);
            font-family: var(--font-sf-pro-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1024px; /* Centered model providing clear boundaries */
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navigation */
        .global-nav {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--color-steel-accent);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
        }

        .nav-brand {
            font-family: var(--font-sf-pro-text);
            font-size: 14px;
            font-weight: 600;
            color: var(--color-midnight-graphite);
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: var(--color-slate-echo);
            font-family: var(--font-sf-pro-text);
            font-size: 12px;
            text-decoration: none;
            letter-spacing: -0.01em;
            padding: 0 10px;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--color-midnight-graphite);
        }

        /* Components from DESIGN.md */
        .btn-primary {
            background-color: var(--color-vivid-blue);
            color: var(--color-pure-white);
            font-family: var(--font-sf-pro-text);
            font-weight: 400;
            font-size: 17px;
            line-height: 1.18;
            letter-spacing: -0.16px;
            border-radius: 28px;
            padding: 11px 22px;
            text-decoration: none;
            display: inline-block;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-primary:hover {
            background-color: var(--color-ocean-blue);
        }

        .btn-ghost {
            background-color: transparent;
            color: var(--color-vivid-blue);
            font-family: var(--font-sf-pro-text);
            font-weight: 400;
            font-size: 17px;
            line-height: 1.18;
            letter-spacing: -0.16px;
            border-radius: 28px;
            padding: 11px 22px;
            text-decoration: none;
            display: inline-block;
            border: 1px solid var(--color-vivid-blue);
            cursor: pointer;
            margin-left: var(--element-gap);
        }

        .text-link {
            font-family: var(--font-sf-pro-text);
            color: var(--color-ocean-blue);
            font-weight: 400;
            text-decoration: none;
        }

        .text-link:hover {
            text-decoration: underline;
        }

        .badge-new {
            color: var(--color-flame-orange);
            font-family: var(--font-sf-pro-text);
            font-size: 12px;
            font-weight: 400;
            background: transparent;
            padding: 0;
            border-radius: 0;
            display: block;
            margin-bottom: 8px;
        }

        /* Layout Utilities */
        .section-gap {
            margin-bottom: var(--section-gap);
        }

        .section-padding {
            padding: 80px 0;
        }

        .surface-white {
            background-color: var(--surface-pure-white);
        }

        .surface-gray {
            background-color: var(--surface-frost-gray);
        }
        
        /* Typography Utilities */
        .text-cloud {
            color: var(--color-cloud-mist);
        }
        
        .text-midnight {
            color: var(--color-midnight-graphite);
        }

        /* Footer */
        .global-footer {
            background-color: var(--surface-frost-gray);
            padding: 40px 0;
            border-top: 1px solid var(--color-steel-accent);
            text-align: center;
        }

        .footer-text {
            font-family: var(--font-sf-pro-text);
            font-size: 12px;
            color: var(--color-cloud-mist);
            letter-spacing: -0.01em;
        }
    
    @media (max-width: 768px) {
        :root {
            --text-display: 40px;
            --leading-display: 1.1;
            --tracking-display: -0.4px;
            --text-heading-lg: 32px;
            --section-gap: 40px;
        }
        .nav-content {
            flex-direction: column;
            height: auto;
            padding: 15px 0;
            gap: 10px;
        }
        .nav-links {
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .section-padding {
            padding: 40px 0;
        }
        .btn-primary, .btn-ghost {
            display: block;
            width: 100%;
            text-align: center;
            margin: 0 0 12px 0 !important;
        }
    }

</style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="global-nav">
        <div class="container nav-content">
            <a href="/" class="nav-brand">Pragith Prakash</a>
            <div class="nav-links">
                <a href="#orchestrators" class="nav-link">Orchestrators</a>
                <a href="#dashboards" class="nav-link">Dashboards</a>
                <a href="#process" class="nav-link">Process</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="global-footer">
        <div class="container">
            <p class="footer-text">Copyright © 2026 Pragith AI Inc. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
