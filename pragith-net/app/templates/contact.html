{% extends "base.html" %}

{% block title %}Contact | Pragith Prakash{% endblock %}

{% block content %}
<section class="py-20">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-6">Contact</h1>
        <p class="text-lg text-slate-600 mb-10">
            Interested in working together? Fill out the form below to discuss your project, architecture review, or AI
            strategy.
        </p>

        {% if error %}
        <div class="rounded-md bg-red-50 p-4 mb-8">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">{{ error }}</h3>
                </div>
            </div>
        </div>
        {% endif %}

        <form action="/contact" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-700">Name</label>
                    <div class="mt-1">
                        <input type="text" name="name" id="name" autocomplete="name" required
                            value="{{ form.name if form else '' }}"
                            class="block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
                    <div class="mt-1">
                        <input type="email" name="email" id="email" autocomplete="email" required
                            value="{{ form.email if form else '' }}"
                            class="block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    </div>
                </div>
            </div>

            <div>
                <label for="company" class="block text-sm font-medium text-slate-700">Company</label>
                <div class="mt-1">
                    <input type="text" name="company" id="company" autocomplete="organization"
                        value="{{ form.company if form else '' }}"
                        class="block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-slate-700">Message</label>
                <div class="mt-1">
                    <textarea id="message" name="message" rows="4" required
                        class="block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">{{ form.message if form else '' }}</textarea>
                </div>
            </div>

            <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY_HERE"></div>
            <!-- TODO: Inject site key from env -->

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Send Message
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
