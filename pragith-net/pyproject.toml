[project]
name = "pragith-net"
version = "0.1.0"
description = "Pragith.net Personal Monolith"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.1.0",
    "requests>=2.31.0",
    "gunicorn>=21.2.0",
    "pyyaml>=6.0.1",
    "markdown>=3.5.2",
    "slowapi>=0.1.9",
    "email-validator>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly tell hatchling where the package is
[tool.hatch.build.targets.wheel]
packages = ["app"]
