version: '3.8'

services:
  web:
    build: .
    container_name: pragith-net
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount content for easier updates without rebuilds in dev, though prod should bake it in or mount volume
      - ./app/content:/app/app/content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
